<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه فاکتور</title>
</head>
<body>
    {{ phone }}
    {{ name }}
    {{ amount }}
    <!-- <form action="/payment/factor/?phone=09398231219&name=علیرضا&amount=1000&desc=پراخت تستی&returnUrl=https://alireza.pythonanywhere.com" method="post"> -->
        <!-- </form> -->
         <!-- {% csrf_token %} -->
         <form action="/payment/factor/?desc=پراخت تستی&phone=09398231219&name=علیرضا یوسف نژاد&amount=1000" method="post">
            {% csrf_token %}
            
            <label for="phone">شماره تلفن:</label>
            <input type="text" id="phone" name="phone" value="{{phone}}" required >
            
            <label for="name">نام:</label>
            <input type="text" id="name" name="name" value="{{name}}" required>
            
            <label for="amount">مقدار:</label>
            <input type="number" id="amount" name="amount" value="{{amount}}" required>
            
            <label for="desc">توضیحات:</label>
            <input type="text" id="desc" name="desc" value="{{desc}}" required>
    


            <button type="submit">پرداخت</button>
        <!-- <button type="submit">پرداخت</button> -->
    

    </form>
</body>
</html>
